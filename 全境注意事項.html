<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#13223a">
  <title>YO! 旅行班｜全境注意事項</title>
  <style>
    :root {
      --ink: #13223a;
      --paper: #f5f7fb;
      --white: #ffffff;
      --line: #d8deea;
      --muted: #5f6d84;
      --accent: #0e9b93;
      --soft: #e6f8f5;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--paper); color: var(--ink); font-family: -apple-system, BlinkMacSystemFont, "Noto Sans TC", "PingFang TC", sans-serif; }
    .shell { width: min(1180px, 100%); margin: 0 auto; padding: 22px 24px 30px; }
    .topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 18px; }
    .brand { font-size: 15px; font-weight: 900; letter-spacing: 0; }
    .back { color: var(--muted); font-size: 13px; text-decoration: none; }
    .back:hover { color: var(--accent); }
    .hero { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: end; gap: 24px; padding: 25px 28px; border: 1px solid var(--ink); border-radius: 8px; background: var(--ink); color: var(--white); }
    .eyebrow { margin: 0 0 8px; color: #a5ead9; font-size: 12px; font-weight: 900; letter-spacing: 0; }
    h1 { margin: 0; font-size: clamp(28px, 4vw, 42px); line-height: 1.15; letter-spacing: 0; }
    .hero p { max-width: 680px; margin: 10px 0 0; color: #c9d4e6; font-size: 14px; line-height: 1.6; }
    .updated { margin: 0; color: #aebcd2; font-size: 12px; white-space: nowrap; }
    .grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-top: 18px; }
    .card { min-height: 176px; padding: 17px; border: 1px solid var(--line); border-radius: 8px; background: var(--white); }
    .number { color: var(--accent); font-size: 12px; font-weight: 900; letter-spacing: 0; }
    h2 { margin: 8px 0 7px; font-size: 17px; line-height: 1.3; letter-spacing: 0; }
    .card p { margin: 0; color: var(--muted); font-size: 13px; line-height: 1.58; }
    .sources { display: flex; align-items: center; justify-content: space-between; gap: 18px; margin-top: 18px; padding: 16px 18px; border: 1px solid #8edbd4; border-radius: 8px; background: var(--soft); }
    .sources strong { font-size: 14px; }
    .sources span { display: block; margin-top: 3px; color: #37696b; font-size: 12px; line-height: 1.45; }
    .source-links { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; }
    .source-links a { padding: 8px 10px; border: 1px solid #77c8c1; border-radius: 6px; color: #176c68; font-size: 12px; font-weight: 800; text-decoration: none; white-space: nowrap; }
    .source-links a:hover { background: #d2f1ec; }
    @media (max-width: 900px) { .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } .card { min-height: 156px; } }
    @media (max-width: 600px) { .shell { padding: 16px 12px 24px; } .hero { grid-template-columns: 1fr; gap: 10px; padding: 22px 18px; } .updated { white-space: normal; } .sources { align-items: flex-start; flex-direction: column; } .source-links { justify-content: flex-start; } }
  </style>
</head>
<body>
  <main class="shell">
    <div class="topbar">
      <div class="brand">YO! 旅行班</div>
      <a class="back" href="index.html">回到地球導覽</a>
    </div>
    <section class="hero">
      <div>
        <p class="eyebrow">COUNTRY CHECK</p>
        <h1 id="title"></h1>
        <p id="intro"></p>
      </div>
      <p class="updated">最後整理：2026 年 7 月 27 日<br>易變動規定以官方與行前通知為準。</p>
    </section>
    <section class="grid" id="grid" aria-label="全境注意事項八格重點"></section>
    <section class="sources">
      <div><strong>出發前再確認</strong><span>入境、簽證、海關與航空規定可能調整，請以官方系統及行前通知為準。</span></div>
      <div class="source-links" id="sourceLinks"></div>
    </section>
  </main>
  <script>
    const countryData = {
      th: {
        flag: "🇹🇭", name: "泰國全境注意事項", intro: "出發前先用 8 格確認；曼谷、芭達雅、清邁與清萊等行程都能先看這一頁。",
        cards: [
          ["護照與入境", "護照、回程或續程資料與住宿資訊放在方便拿取的位置；最終入境仍由泰國移民官決定。"],
          ["TDAC 數位入境卡", "外國旅客入境泰國前，需在抵達日前 3 天內填寫 TDAC。它不是簽證，官方系統免費。"],
          ["行李與禁帶物", "托運與隨身行李先照航空公司規定整理；肉類、新鮮植物與不確定的食品，先不要帶回台灣。"],
          ["電子菸與菸品", "電子菸、煙油與相關設備不要帶；菸酒與其他管制品請以最新海關規定與行前通知為準。"],
          ["貨幣與付款", "泰銖小額現金在市集與小店仍實用；信用卡、電子支付是否可用，依店家與地區而不同。"],
          ["插座、網路與交通", "常見兩孔或萬用插座，萬用轉接頭最省事；網路可依自己的使用習慣選 eSIM、漫遊或當地 SIM。"],
          ["文化與寺廟", "進寺廟時尊重現場服裝與拍攝規範；參拜、拍照與購物都以現場指示為準。"],
          ["回台前整理", "護照、手機、錢包與行動電源先分開確認；行動電源放隨身，不確定的伴手禮先不帶。"]
        ],
        sources: [["TDAC 官方", "https://tdac.immigration.go.th/"], ["泰國移民局說明", "https://tdac.immigration.go.th/manual/en/"]]
      },
      vn: {
        flag: "🇻🇳", name: "越南全境注意事項", intro: "中越、北越與未來越南行程都可以先從這 8 格快速確認。",
        cards: [
          ["護照與入境", "護照、回程或續程資料與住宿資訊先備好；簽證與入境資格依護照、行程與當期規定確認。"],
          ["簽證與電子簽", "需要電子簽證時，只使用越南移民局官方入口；護照英文姓名、號碼與抵達資訊要逐字核對。"],
          ["行李與禁帶物", "行動電源、液體與托運規定先依航空公司整理；不確定的動植物、肉類與食品不要帶回台灣。"],
          ["現金與付款", "越盾面額大，付款前先看清楚金額；刷卡與行動支付在不同城市、店家間的使用情況不同。"],
          ["插座與網路", "常見兩孔插座，帶萬用轉接頭較方便；eSIM、漫遊與當地 SIM 都可依行程和用量選擇。"],
          ["交通與移動", "市區交通節奏快，過馬路、上下車與自由活動時依現場安排；證件與貴重物品隨身保管。"],
          ["文化與服裝", "進宗教場所或古蹟，服裝與拍攝方式尊重現場規範；遇到不確定的情況先問再做。"],
          ["回台前整理", "護照、房卡、手機、錢包與行動電源分開確認；伴手禮看不懂成分或來源時，先不要帶。"]
        ],
        sources: [["越南電子簽證官方", "https://evisa.immigration.gov.vn/"], ["越南移民局電子簽說明", "https://evisa.immigration.gov.vn/trang-chu-ttdt"]]
      },
      sg: {
        flag: "🇸🇬", name: "新加坡注意事項", intro: "新加坡行程先用這 8 格確認，城市旅行需要的重點都收在這裡。",
        cards: [
          ["護照與入境", "入境時準備個人有效旅行證件、回程或續程資料；外國旅客護照通常需保留至少 6 個月效期。"],
          ["SG Arrival Card", "抵達日前 3 天內可提交 SG Arrival Card，包含抵達當日。官方 e-Service 與 MyICA App 免費，SGAC 不是簽證。"],
          ["行李與禁帶物", "托運與隨身行李先照航空公司規定整理；肉類、植物與不確定食品不要帶回台灣。"],
          ["電子菸", "電子菸及相關產品不要帶進新加坡；不確定的菸品、藥品或管制物，出發前先查官方規定。"],
          ["貨幣與付款", "刷卡與行動支付普及，小額現金仍可備一些；付款時注意幣別、服務費與店家標示。"],
          ["插座與網路", "常見英規 Type G 插座，帶萬用轉接頭最方便；網路可選 eSIM、漫遊或當地 SIM。"],
          ["城市規矩", "大眾運輸、商場與景點都有清楚規範；排隊、垃圾處理與拍攝都以現場告示為準。"],
          ["回台前整理", "護照、手機、錢包與行動電源先分開確認；行動電源放隨身，不確定的伴手禮先不帶。"]
        ],
        sources: [["SG Arrival Card 官方", "https://eservices.ica.gov.sg/sgarrivalcard/"], ["ICA 入境資訊", "https://www.ica.gov.sg/enter-transit-depart/entering-singapore"]]
      },
      my: {
        flag: "🇲🇾", name: "馬來西亞全境注意事項", intro: "吉隆坡、馬六甲與未來馬來西亞各地行程，都能先用這 8 格快速確認。",
        cards: [
          ["護照與入境", "護照、回程或續程資料與住宿資訊先備好；入境資格與最終許可仍以移民官判定為準。"],
          ["MDAC 數位入境卡", "外國旅客入境前，通常需在抵達日前 3 天內完成 MDAC。填寫前先核對護照英文姓名、號碼與抵達日期。"],
          ["行李與禁帶物", "托運與隨身行李先照航空公司規定整理；肉類、新鮮植物與不確定食品，先不要帶回台灣。"],
          ["菸品與管制物", "菸酒、電子菸與其他管制物的規定可能調整；不確定時不要攜帶，改看官方海關說明。"],
          ["貨幣與付款", "令吉小額現金在夜市或小店很實用；信用卡、電子支付與匯率依店家和地區而不同。"],
          ["插座與網路", "常見英規 Type G 插座，帶萬用轉接頭較方便；網路可依行程與用量選 eSIM、漫遊或當地 SIM。"],
          ["文化與宗教", "進清真寺、寺廟等場所時，依現場服裝、脫鞋與拍攝規範行動，保持尊重與安靜。"],
          ["回台前整理", "護照、房卡、手機、錢包與行動電源分開確認；不確定成分、來源或是否可帶回的伴手禮，先不要帶。"]
        ],
        sources: [["MDAC 官方入口", "https://imigresen-online.imi.gov.my/mdac/main"], ["馬來西亞海關旅客指南", "https://www.customs.gov.my/en/individu/pengembara/travelers-guide"]]
      }
    };

    const key = new URLSearchParams(window.location.search).get("country") || "th";
    const country = countryData[key] || countryData.th;
    document.title = `${country.flag} YO! 旅行班｜${country.name}`;
    document.getElementById("title").textContent = `${country.flag} ${country.name}`;
    document.getElementById("intro").textContent = country.intro;
    document.getElementById("grid").innerHTML = country.cards.map(([title, text], index) => `
      <article class="card"><div class="number">${String(index + 1).padStart(2, "0")}</div><h2>${title}</h2><p>${text}</p></article>
    `).join("");
    document.getElementById("sourceLinks").innerHTML = country.sources.map(([label, url]) => `<a href="${url}" target="_blank" rel="noopener">${label}</a>`).join("");
  </script>
</body>
</html>
